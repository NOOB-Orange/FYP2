<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <link rel="stylesheet" href="/css/style.css">

    <script>
        async function loginUser(event) {
            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let loginButton = document.getElementById("loginButton");

            loginButton.innerText = "登录中...";
            loginButton.disabled = true;

            try {
                // 确保使用正确的API URL - 使用dev.thintuit.com域名
                let apiUrl = "https://dev.thintuit.com/login";
                
                // 检查并确保API URL不包含端口号
                if (apiUrl.includes(":41284") || apiUrl.includes(":41285")) {
                    apiUrl = apiUrl.replace(/:\d+/, "");
                }

                let response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    if (response.status === 301 || response.status === 302) {
                        // 处理重定向
                        window.location.href = response.headers.get("Location") || "/dashboard.html";
                        return;
                    }
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                let data = await response.json();

                if (response.ok) {
                    alert("登录成功！即将跳转到主页...");
                    localStorage.setItem('is_logged_in', 'true');
                    localStorage.setItem('user_id', data.user.id);
                    localStorage.setItem('user_name', data.user.name);
                    localStorage.setItem('user_role', data.user.role);
                    window.location.href = "https://data.thintuit.com/dashboard/";  // 重定向回data域名的dashboard页面
                } else {
                    alert("登录失败：" + (data.detail || "未知错误"));  // 显示错误信息
                }
            } catch (error) {
                console.error("登录请求失败:", error);
                alert("登录请求失败：" + error.message);
            } finally {
                loginButton.innerText = "登录";
                loginButton.disabled = false;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>用户登录</h2>
        <form onsubmit="loginUser(event)">
            <div class="input-group">
                <label for="email">邮箱:</label>
                <input type="email" id="email" required placeholder="请输入邮箱">
            </div>

            <div class="input-group">
                <label for="password">密码:</label>
                <input type="password" id="password" required placeholder="请输入密码">
            </div>

            <button type="submit" id="loginButton" class="btn">登录</button>
        </form>

        <p>没有账户？ <a href="https://data.thintuit.com/register/">点击注册</a></p>
        <a href="https://data.thintuit.com/" class="back-home">🏠 返回主页</a>
    </div>
</body>
</html>
