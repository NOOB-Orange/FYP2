<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="/css/style.css">

    <script>
        async function loginUser(event) {
            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let loginButton = document.getElementById("loginButton");

            loginButton.innerText = "Logging in...";
            loginButton.disabled = true;

            try {
                let apiUrl = "https://dev.thintuit.com/login";

                if (apiUrl.includes(":41284") || apiUrl.includes(":41285")) {
                    apiUrl = apiUrl.replace(/:\d+/, "");
                }

                let response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    if (response.status === 301 || response.status === 302) {
                        window.location.href = response.headers.get("Location") || "/dashboard.html";
                        return;
                    }
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                let data = await response.json();

                if (response.ok) {
                    alert("Login successful! Redirecting to dashboard...");
                    localStorage.setItem('is_logged_in', 'true');
                    localStorage.setItem('user_id', data.user.id);
                    localStorage.setItem('user_name', data.user.name);
                    localStorage.setItem('user_role', data.user.role);
                    window.location.href = "https://data.thintuit.com/dashboard/";
                } else {
                    alert("Login failed: " + (data.detail || "Unknown error"));
                }
            } catch (error) {
                console.error("Login request failed:", error);
                alert("Login request failed: " + error.message);
            } finally {
                loginButton.innerText = "Login";
                loginButton.disabled = false;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>User Login</h2>
        <form onsubmit="loginUser(event)">
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>

            <button type="submit" id="loginButton" class="btn">Login</button>
        </form>

        <p>Don't have an account? <a href="https://data.thintuit.com/register/">Click to register</a></p>
        <a href="https://data.thintuit.com/" class="back-home">🏠 Back to Homepage</a>
    </div>
</body>
</html>
