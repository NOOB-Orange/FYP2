<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>识别准确率可视化</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .dropdown {
      position: relative;
      display: inline-block;
      margin: 0 10px;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 200px;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      padding: 10px;
      border-radius: 8px;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
    canvas {
      display: block;
      margin: 20px auto;
      width: 100%;
      max-width: 1000px;
      height: 600px;
    }
    .back-button, .export-button, .toggle-button {
      display: inline-block;
      margin: 10px 5px;
      text-align: center;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }
    .back-button:hover,
    .export-button:hover,
    .toggle-button:hover {
      text-decoration: underline;
    }
    input[type=color] {
      width: 40px;
      height: 24px;
      padding: 0;
      margin-left: 5px;
      border: none;
    }
    .color-indicator {
      width: 15px;
      height: 15px;
      display: inline-block;
      margin: 0 5px;
      border-radius: 3px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>模型对各分类的识别准确率</h2>
  <div class="controls">
    <div class="dropdown">
      <span>筛选模型 ▼</span>
      <div class="dropdown-content" id="model-filters"></div>
    </div>
    <div class="dropdown">
      <span>筛选分类 ▼</span>
      <div class="dropdown-content" id="category-filters"></div>
    </div>
    <div class="dropdown">
      <span>图表类型 ▼</span>
      <div class="dropdown-content" id="chart-types">
        <label><input type="checkbox" value="bar" checked onchange="renderCharts()"> 柱状图</label><br>
        <label><input type="checkbox" value="line" onchange="renderCharts()"> 折线图</label><br>
        <label><input type="checkbox" value="radar" onchange="renderCharts()"> 雷达图</label><br>
      </div>
    </div>
    <span class="toggle-button" onclick="toggleOrientation()">🔁 切换图表方向</span>
    <span class="export-button" onclick="downloadChart()">📤 导出图表图片</span>
  </div>
  <div id="chart-container"></div>
  <a class="back-button" href="/dashboard/">← 返回仪表盘</a>
</div>


<script>
    const userId = localStorage.getItem("user_id");
    if (!userId) {
      alert("请先登录后再查看可视化内容！");
      window.location.href = "/login";
    }
  
    const chartData = {
      raw: [],
      charts: [],
      horizontal: true,
      colors: {}
    };
  
    const categoryMap = {
      "RECYCLABLE": "可回收物",
      "HOUSEHOLD": "厨余垃圾",
      "HAZARDOUS": "有害垃圾",
      "RESIDUAL": "其他垃圾"
    };
  
    const API_BASE = location.hostname.includes("dev.thintuit.com") ? "" : "https://dev.thintuit.com";
  
    fetch(`${API_BASE}/api/accuracy`)
      .then(response => response.json())
      .then(data => {
        chartData.raw = data;
        renderControls();
        renderCharts();
      });
  
    function renderControls() {
      const models = [...new Set(chartData.raw.map(d => d.model_id))];
      const categories = [...new Set(chartData.raw.map(d => d.correct_category))];
  
      const modelContainer = document.getElementById("model-filters");
      const categoryContainer = document.getElementById("category-filters");
  
      modelContainer.innerHTML = "";
      categoryContainer.innerHTML = "";
  
      models.forEach(model => {
        chartData.colors[model] = chartData.colors[model] || getRandomColor();
        const id = `model-${model}`;
        const color = chartData.colors[model];
        modelContainer.innerHTML += `<label style="display: flex; align-items: center;"><input type="checkbox" checked id="${id}" onchange="renderCharts()"> <span class="color-indicator" style="background:${color};"></span>${model}<input type="color" value="${color}" onchange="chartData.colors['${model}']=this.value; renderCharts();"></label>`;
      });
  
      categories.forEach(cat => {
        const id = `cat-${cat}`;
        categoryContainer.innerHTML += `<label><input type="checkbox" checked id="${id}" onchange="renderCharts()"> ${categoryMap[cat] || cat}</label><br>`;
      });
    }
  
    function getAxisTitle(axis, type, isHorizontal) {
      if (["radar", "pie", "doughnut"].includes(type)) return "";
      if (type === "bar" && isHorizontal) return axis === "x" ? "准确率 (%)" : "分类";
      if (type === "bar" && !isHorizontal) return axis === "x" ? "分类" : "准确率 (%)";
      if (type === "line") return axis === "x" ? "分类" : "准确率 (%)";
      return "";
    }
  
    function renderCharts() {
    // 清除旧图表
    chartData.charts.forEach(chart => chart.destroy());
    chartData.charts = [];

    const chartTypes = [...document.querySelectorAll('#chart-types input:checked')].map(input => input.value);
    const container = document.getElementById("chart-container");
    container.innerHTML = "";

    chartTypes.forEach(type => {
      const canvas = document.createElement("canvas");
      container.appendChild(canvas);
      const ctx = canvas.getContext("2d");

      const selectedModels = chartData.raw.map(d => d.model_id).filter((v, i, a) => a.indexOf(v) === i && document.getElementById(`model-${v}`)?.checked);
      const selectedCats = ["RECYCLABLE", "HOUSEHOLD", "HAZARDOUS", "RESIDUAL"].filter(cat =>
        chartData.raw.some(d => d.correct_category === cat) &&
        document.getElementById(`cat-${cat}`)?.checked
      );
      const labels = selectedCats.map(cat => categoryMap[cat] || cat);

      const datasets = selectedModels.map(model => {
        return {
          label: model,
          data: selectedCats.map(cat => {
            const item = chartData.raw.find(d => d.model_id === model && d.correct_category === cat);
            return item ? item.accuracy_percent : 0;
          }),
          backgroundColor: type === 'pie' || type === 'doughnut' ? selectedCats.map(() => chartData.colors[model]) : chartData.colors[model],
          borderColor: chartData.colors[model],
          fill: type === 'radar',
          tension: 0.3
        };
      });

      const chart = new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          indexAxis: type === "bar" && chartData.horizontal ? "y" : "x",
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            title: {
              display: true,
              text: `图表类型：${type}`,
              font: { size: 18 }
            },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${ctx.raw}%`
              }
            },
            legend: {
              position: "bottom"
            }
          },

          scales: (["radar", "pie", "doughnut"].includes(type)) ? {} : {
            x: {
              beginAtZero: true,
              max: 100,
              title: {
                display: true,
                text: getAxisTitle("x", type, chartData.horizontal)
              }
            },
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: getAxisTitle("y", type, chartData.horizontal)
              }
            }
          }
        }
      });

      chartData.charts.push(chart);
    });
  }

  function toggleOrientation() {
    chartData.horizontal = !chartData.horizontal;
    renderCharts();
  }

  function downloadChart() {
    const charts = document.querySelectorAll("#chart-container canvas");
    charts.forEach((canvas, i) => {
      const link = document.createElement("a");
      const whiteBG = document.createElement("canvas");
      const ctx = whiteBG.getContext("2d");
      whiteBG.width = canvas.width;
      whiteBG.height = canvas.height;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, whiteBG.width, whiteBG.height);
      ctx.drawImage(canvas, 0, 0);
      link.download = `chart_${i + 1}.png`;
      link.href = whiteBG.toDataURL();
      link.click();
    });
  }

  function getRandomColor() {
    const r = Math.floor(Math.random() * 200);
    const g = Math.floor(Math.random() * 200);
    const b = Math.floor(Math.random() * 200);
    return `rgba(${r},${g},${b},0.6)`;
  }
</script>
</body>
</html>
