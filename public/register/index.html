<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    
    <link rel="stylesheet" href="https://data.thintuit.com/css/style.css">
    <script src="https://data.thintuit.com/js/main.js" defer></script>

    <script>
        async function registerUser(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            try {
                let response = await fetch("https://data.thintuit.com/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password })
                });

                let data = await response.json();

                if (response.ok) {
                    alert("Registration successful! Please click 'Already have an account? Click to login' to proceed.");
                    document.getElementById("name").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("password").value = "";
                } else {
                    throw new Error(data.detail || "Registration failed");
                }
            } catch (error) {
                console.error("Registration request failed:", error);
                alert("Registration failed: " + error.message);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>User Registration</h2>
        <form onsubmit="registerUser(event)">
            <div class="input-group">
                <label for="name">Username:</label>
                <input type="text" id="name" required placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <p>Already have an account? <a href="https://data.thintuit.com/login/">Click to login</a></p>
        <a href="https://data.thintuit.com/" class="back-home">🏠 Back to Homepage</a>
    </div>
</body>
</html>
